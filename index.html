<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baticueva - Menú</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #0c0d11;
        }

        #panzoom-container {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Envolvemos la imagen en un div que ocupa el 100% de la pantalla */
        #panzoom-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            /* CRUCIAL: Bloquea gestos nativos para que Panzoom tome el control */
            touch-action: none; 
            cursor: grab;
        }

        #panzoom-element {
            display: block;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            image-rendering: -webkit-optimize-contrast;
            /* Evita que el navegador intente arrastrar la imagen como archivo */
            user-select: none;
            -webkit-user-drag: none;
        }
    </style>
</head>
<body>

    <div id="panzoom-container">
        <div id="panzoom-wrapper">
            <img id="panzoom-element" src="image_0.png" alt="Menú de Bebidas">
        </div>
    </div>

    <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>

    <script>
        const wrapper = document.getElementById('panzoom-wrapper');

        // Inicializamos Panzoom en el WRAPPER
        const panzoom = Panzoom(wrapper, {
            maxScale: 15,       // Zoom muy potente solicitado
            minScale: 1,        // No permite que la imagen se vea más pequeña que la pantalla
            initialScale: 1,
            contain: 'inside',  // ESTABILIDAD: Evita que la imagen se desplace fuera de los bordes
            cursor: 'grab'
        });

        // Zoom con la rueda del ratón (PC)
        wrapper.addEventListener('wheel', panzoom.zoomWithWheel);

        // Resetear con doble clic o doble toque
        wrapper.addEventListener('dblclick', () => {
            panzoom.reset({ animate: true });
        });
    </script>

</body>
</html>
