<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baticueva - Menú</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #0c0d11;
        }

        #panzoom-container {
            width: 100vw;
            height: 100vh;
            /* Eliminamos el flex-centering que causa el recorte */
            position: relative;
            overflow: hidden;
            display: block;
        }

        #panzoom-element {
            /* Dejamos que la imagen use su tamaño natural, Panzoom la escalará */
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Ajusta la imagen para que se vea completa sin deformarse */
            object-fit: contain; 
            image-rendering: -webkit-optimize-contrast;
            touch-action: none; 
            user-select: none;
            -webkit-user-drag: none;
        }
    </style>
</head>
<body>

    <div id="panzoom-container">
        <img id="panzoom-element" src="image_0.png" alt="Menú de Bebidas">
    </div>

    <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>

    <script>
        const elem = document.getElementById('panzoom-element');
        
        const panzoom = Panzoom(elem, {
            maxScale: 12,       // Súper Zoom
            minScale: 1,        // No permite que se vea más pequeña que la pantalla
            initialScale: 1,
            contain: 'inside',  // 'inside' es vital para que NO se corte en móviles al cargar
            cursor: 'grab'
        });

        const container = document.getElementById('panzoom-container');

        // Zoom con rueda (PC)
        container.addEventListener('wheel', panzoom.zoomWithWheel);

        // Forzar a que la imagen esté centrada y visible al inicio
        setTimeout(() => {
            panzoom.pan(0, 0); // Asegura que empiece en la esquina superior izquierda
        }, 10);

        // Doble clic para resetear si se pierden
        container.addEventListener('dblclick', () => {
            panzoom.reset();
        });
    </script>

</body>
</html>
