<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baticueva - Menú</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #0c0d11;
        }

        #panzoom-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            /* CRUCIAL: Esto permite que el contenedor capture los toques en el móvil */
            touch-action: none; 
            cursor: grab;
        }

        #panzoom-element {
            max-width: 100%;
            max-height: 100%;
            display: block;
            image-rendering: -webkit-optimize-contrast;
            /* Evita que el navegador intente arrastrar la imagen como un archivo */
            user-select: none;
            -webkit-user-drag: none;
        }
    </style>
</head>
<body>

    <div id="panzoom-container">
        <img id="panzoom-element" src="image_0.png" alt="Menú de Bebidas">
    </div>

    <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>

    <script>
        const elem = document.getElementById('panzoom-element');
        const container = document.getElementById('panzoom-container');

        // Función para iniciar el zoom una vez que la imagen esté lista
        function initPanzoom() {
            const panzoom = Panzoom(elem, {
                maxScale: 12,       // Zoom máximo
                minScale: 1,        // Zoom mínimo
                initialScale: 1,
                contain: 'inside',  // Evita que la imagen se pierda fuera de los bordes
                noBind: true,       // Nosotros manejaremos los eventos manualmente para mayor precisión
            });

            // 1. Zoom con la rueda del ratón (PC)
            container.addEventListener('wheel', panzoom.zoomWithWheel);

            // 2. Soporte para gestos táctiles y arrastre (Móvil y PC)
            // Vinculamos los eventos del contenedor directamente a Panzoom
            container.addEventListener('pointerdown', panzoom.handleDown);
            container.addEventListener('pointermove', panzoom.handleMove);
            container.addEventListener('pointerup', panzoom.handleUp);

            // 3. Doble clic para resetear
            container.addEventListener('dblclick', () => {
                panzoom.reset();
            });
        }

        // Ejecutamos la función: si la imagen ya cargó, inicia; si no, espera al evento 'load'
        if (elem.complete) {
            initPanzoom();
        } else {
            elem.addEventListener('load', initPanzoom);
        }
    </script>

</body>
</html>
