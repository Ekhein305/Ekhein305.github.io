<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baticueva - Menú</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #0c0d11;
        }

        #panzoom-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            /* CRUCIAL: Bloquea el scroll nativo para que el pellizco funcione */
            touch-action: none; 
            cursor: grab;
        }

        #panzoom-element {
            display: block;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            image-rendering: -webkit-optimize-contrast;
            /* Evita que el móvil intente "seleccionar" o "arrastrar" la imagen */
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: none; /* Los eventos los capturará el contenedor */
        }
    </style>
</head>
<body>

    <div id="panzoom-container">
        <img id="panzoom-element" src="image_0.png" alt="Menú de Bebidas">
    </div>

    <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>

    <script>
        const elem = document.getElementById('panzoom-element');
        const container = document.getElementById('panzoom-container');

        function iniciarMenu() {
            const panzoom = Panzoom(elem, {
                maxScale: 12,      // Zoom potente solicitado
                minScale: 1,
                initialScale: 1,
                contain: 'inside', // Mantiene la imagen visible sin cortes
                noBind: true       // Manejaremos los eventos manualmente para máxima compatibilidad
            });

            // ZOOM PC (Rueda del ratón)
            container.addEventListener('wheel', panzoom.zoomWithWheel);

            // ZOOM MÓVIL (Pellizco y arrastre)
            // Vinculamos los toques del contenedor directamente a la librería
            container.addEventListener('pointerdown', panzoom.handleDown);
            container.addEventListener('pointermove', panzoom.handleMove);
            container.addEventListener('pointerup', panzoom.handleUp);

            // DOBLE CLIC / TOQUE para resetear
            container.addEventListener('dblclick', () => {
                panzoom.reset({ animate: true });
            });
        }

        // Ejecutar cuando la imagen esté cargada
        if (elem.complete) {
            iniciarMenu();
        } else {
            elem.addEventListener('load', iniciarMenu);
        }
    </script>

</body>
</html>
