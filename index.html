<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baticueva - Menú</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0c0d11;
        }

        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
            -webkit-overflow-scrolling: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #scene {
            position: relative;
            transform-origin: 0 0;
            will-change: transform;
        }

        #menu-img {
            display: block;
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;
        }
    </style>
</head>
<body>

<div id="viewport">
    <div id="scene">
        <img id="menu-img" src="image_0.png" alt="Menú de Bebidas">
    </div>
</div>

<script>
(function () {
    const viewport = document.getElementById('viewport');
    const scene    = document.getElementById('scene');

    let scale   = 1;
    let panX    = 0;
    let panY    = 0;

    const MIN_SCALE = 1;
    const MAX_SCALE = 12;

    function clamp(v, lo, hi) { return Math.min(Math.max(v, lo), hi); }

    function applyTransform(animate) {
        if (animate) {
            scene.style.transition = 'transform 0.3s ease';
            setTimeout(function() { scene.style.transition = ''; }, 320);
        } else {
            scene.style.transition = '';
        }
        scene.style.transform =
            'translate(' + panX + 'px,' + panY + 'px) scale(' + scale + ')';
    }

    function clampPan() {
        var vw = viewport.clientWidth;
        var vh = viewport.clientHeight;
        var iw = scene.offsetWidth  * scale;
        var ih = scene.offsetHeight * scale;
        var maxX = Math.max(0, (iw - vw) / 2);
        var maxY = Math.max(0, (ih - vh) / 2);
        panX = clamp(panX, -maxX, maxX);
        panY = clamp(panY, -maxY, maxY);
    }

    function resetView() {
        scale = 1; panX = 0; panY = 0;
        applyTransform(true);
    }

    function zoomAt(cx, cy, newScale) {
        newScale = clamp(newScale, MIN_SCALE, MAX_SCALE);
        var ratio = newScale / scale;
        panX = cx - ratio * (cx - panX);
        panY = cy - ratio * (cy - panY);
        scale = newScale;
        clampPan();
        applyTransform(false);
    }

    function getTouchDist(t1, t2) {
        var dx = t1.clientX - t2.clientX;
        var dy = t1.clientY - t2.clientY;
        return Math.sqrt(dx * dx + dy * dy);
    }
    function getTouchMid(t1, t2) {
        return {
            x: (t1.clientX + t2.clientX) / 2,
            y: (t1.clientY + t2.clientY) / 2
        };
    }
    function toViewportCenter(clientX, clientY) {
        var rect = viewport.getBoundingClientRect();
        return {
            x: clientX - rect.left - rect.width  / 2,
            y: clientY - rect.top  - rect.height / 2
        };
    }

    var lastDist   = 0;
    var lastMid    = null;
    var lastPan    = null;
    var isPinching = false;
    var tapCount   = 0;
    var tapTimer   = null;
    var tapPos     = null;

    viewport.addEventListener('touchstart',  onTouchStart,  { passive: false });
    viewport.addEventListener('touchmove',   onTouchMove,   { passive: false });
    viewport.addEventListener('touchend',    onTouchEnd,    { passive: false });
    viewport.addEventListener('touchcancel', onTouchEnd,    { passive: false });

    function onTouchStart(e) {
        e.preventDefault();

        if (e.touches.length === 2) {
            isPinching = true;
            lastDist   = getTouchDist(e.touches[0], e.touches[1]);
            lastMid    = getTouchMid(e.touches[0], e.touches[1]);
            lastPan    = null;
        } else if (e.touches.length === 1) {
            isPinching = false;
            lastPan    = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            tapPos     = { x: e.touches[0].clientX, y: e.touches[0].clientY };

            tapCount++;
            if (tapCount === 1) {
                tapTimer = setTimeout(function() { tapCount = 0; }, 300);
            } else if (tapCount >= 2) {
                clearTimeout(tapTimer);
                tapCount = 0;
                var c = toViewportCenter(tapPos.x, tapPos.y);
                if (scale > 1) { resetView(); } else { zoomAt(c.x, c.y, 3); }
            }
        }
    }

    function onTouchMove(e) {
        e.preventDefault();

        if (e.touches.length === 2) {
            var t1  = e.touches[0], t2 = e.touches[1];
            var d   = getTouchDist(t1, t2);
            var mid = getTouchMid(t1, t2);
            var c   = toViewportCenter(mid.x, mid.y);

            if (lastDist > 0) {
                zoomAt(c.x, c.y, scale * (d / lastDist));
            }
            if (lastMid) {
                panX += mid.x - lastMid.x;
                panY += mid.y - lastMid.y;
                clampPan();
                applyTransform(false);
            }

            lastDist = d;
            lastMid  = mid;

        } else if (e.touches.length === 1 && !isPinching && lastPan) {
            var dx = e.touches[0].clientX - lastPan.x;
            var dy = e.touches[0].clientY - lastPan.y;
            panX += dx;
            panY += dy;
            clampPan();
            applyTransform(false);
            lastPan = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
    }

    function onTouchEnd(e) {
        e.preventDefault();
        if (e.touches.length < 2) {
            isPinching = false;
            lastDist   = 0;
            lastMid    = null;
        }
        if (e.touches.length === 0) {
            lastPan = null;
            if (scale < MIN_SCALE) resetView();
        }
    }

    viewport.addEventListener('wheel', function(e) {
        e.preventDefault();
        var c      = toViewportCenter(e.clientX, e.clientY);
        var factor = e.deltaY < 0 ? 1.15 : (1 / 1.15);
        zoomAt(c.x, c.y, scale * factor);
    }, { passive: false });

    viewport.addEventListener('dblclick', function(e) {
        var c = toViewportCenter(e.clientX, e.clientY);
        if (scale > 1) { resetView(); } else { zoomAt(c.x, c.y, 3); }
    });

    applyTransform(false);

})();
</script>
</body>
</html>
