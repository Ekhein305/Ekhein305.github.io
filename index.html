<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baticueva - Menú</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0c0d11;
        }

        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
            cursor: grab;
            user-select: none;
        }

        #viewport.grabbing {
            cursor: grabbing;
        }

        #scene {
            position: relative;
            transform-origin: center center;
            will-change: transform;
        }

        #menu-img {
            display: block;
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: none;
            image-rendering: -webkit-optimize-contrast;
        }
    </style>
</head>
<body>

<div id="viewport">
    <div id="scene">
        <img id="menu-img" src="image_0.png" alt="Menú de Bebidas">
    </div>
</div>

<script>
(function () {
    const viewport = document.getElementById('viewport');
    const scene    = document.getElementById('scene');

    // ── Estado ──────────────────────────────────────────────────────────────
    let scale   = 1;
    let originX = 0;   // traslación en px
    let originY = 0;

    const MIN_SCALE = 1;
    const MAX_SCALE = 12;

    // ── Helpers ──────────────────────────────────────────────────────────────
    function clamp(v, lo, hi) { return Math.min(Math.max(v, lo), hi); }

    function applyTransform() {
        scene.style.transform = `translate(${originX}px, ${originY}px) scale(${scale})`;
    }

    /** Limita la traslación para que la imagen no salga de la pantalla */
    function clampTranslation() {
        const vw = viewport.clientWidth;
        const vh = viewport.clientHeight;
        const iw = scene.offsetWidth  * scale;
        const ih = scene.offsetHeight * scale;

        const maxX = Math.max(0, (iw - vw) / 2);
        const maxY = Math.max(0, (ih - vh) / 2);

        originX = clamp(originX, -maxX, maxX);
        originY = clamp(originY, -maxY, maxY);
    }

    function resetView(animate) {
        if (animate) {
            scene.style.transition = 'transform 0.35s ease';
            setTimeout(() => { scene.style.transition = ''; }, 380);
        }
        scale   = 1;
        originX = 0;
        originY = 0;
        applyTransform();
    }

    // ── Zoom centrado en un punto (px relativos al viewport) ─────────────────
    function zoomAt(cx, cy, newScale) {
        newScale = clamp(newScale, MIN_SCALE, MAX_SCALE);

        // Convertir centro del gesto a coordenadas del scene antes del zoom
        const ratio = newScale / scale;

        // El punto cx,cy debe quedar fijo; ajustamos la traslación
        // Fórmula: newOrigin = cx - ratio * (cx - originX)  … idem Y
        originX = cx - ratio * (cx - originX);
        originY = cy - ratio * (cy - originY);
        scale   = newScale;

        clampTranslation();
        applyTransform();
    }

    // ── Distancia entre dos toques ───────────────────────────────────────────
    function dist(t1, t2) {
        const dx = t1.clientX - t2.clientX;
        const dy = t1.clientY - t2.clientY;
        return Math.sqrt(dx * dx + dy * dy);
    }

    function midpoint(t1, t2) {
        return {
            x: (t1.clientX + t2.clientX) / 2,
            y: (t1.clientY + t2.clientY) / 2,
        };
    }

    // ── Estado de gestos ─────────────────────────────────────────────────────
    let lastDist    = null;
    let lastMid     = null;
    let lastPointer = null;   // para arrastre de 1 dedo
    let isPinching  = false;
    let tapTimer    = null;
    let tapCount    = 0;

    const activeTouches = new Map();  // pointerId → evento

    // ── Pointer Events (unificados mouse + touch) ────────────────────────────
    viewport.addEventListener('pointerdown', onDown,   { passive: false });
    viewport.addEventListener('pointermove', onMove,   { passive: false });
    viewport.addEventListener('pointerup',   onUp,     { passive: false });
    viewport.addEventListener('pointercancel', onUp,   { passive: false });

    function onDown(e) {
        e.preventDefault();
        viewport.setPointerCapture(e.pointerId);
        activeTouches.set(e.pointerId, e);
        viewport.classList.add('grabbing');

        if (activeTouches.size === 2) {
            // Iniciar pinch
            isPinching = true;
            const [t1, t2] = [...activeTouches.values()];
            lastDist = dist(t1, t2);
            lastMid  = midpoint(t1, t2);
            lastPointer = null;
        } else if (activeTouches.size === 1) {
            isPinching  = false;
            lastPointer = { x: e.clientX, y: e.clientY };

            // Detectar doble toque
            tapCount++;
            if (tapCount === 1) {
                tapTimer = setTimeout(() => { tapCount = 0; }, 300);
            } else if (tapCount === 2) {
                clearTimeout(tapTimer);
                tapCount = 0;
                if (scale > 1) {
                    resetView(true);
                } else {
                    // Zoom x3 centrado donde tocó
                    const rect = viewport.getBoundingClientRect();
                    zoomAt(e.clientX - rect.left - rect.width  / 2,
                           e.clientY - rect.top  - rect.height / 2,
                           3);
                }
            }
        }
    }

    function onMove(e) {
        e.preventDefault();
        if (!activeTouches.has(e.pointerId)) return;
        activeTouches.set(e.pointerId, e);

        if (activeTouches.size === 2) {
            // ── Pinch-zoom ──
            const [t1, t2] = [...activeTouches.values()];
            const d   = dist(t1, t2);
            const mid = midpoint(t1, t2);

            const rect = viewport.getBoundingClientRect();
            const cx = mid.x - rect.left - rect.width  / 2;
            const cy = mid.y - rect.top  - rect.height / 2;

            if (lastDist !== null) {
                const newScale = scale * (d / lastDist);
                zoomAt(cx, cy, newScale);

                // Arrastre simultáneo al pinch (paneo)
                originX += mid.x - lastMid.x;
                originY += mid.y - lastMid.y;
                clampTranslation();
                applyTransform();
            }

            lastDist = d;
            lastMid  = mid;

        } else if (activeTouches.size === 1 && !isPinching && lastPointer) {
            // ── Paneo de 1 dedo ──
            const dx = e.clientX - lastPointer.x;
            const dy = e.clientY - lastPointer.y;
            originX += dx;
            originY += dy;
            clampTranslation();
            applyTransform();
            lastPointer = { x: e.clientX, y: e.clientY };
        }
    }

    function onUp(e) {
        e.preventDefault();
        activeTouches.delete(e.pointerId);
        viewport.classList.remove('grabbing');

        if (activeTouches.size < 2) {
            lastDist    = null;
            lastMid     = null;
            isPinching  = false;
        }
        if (activeTouches.size === 0) {
            lastPointer = null;
            // Si el zoom quedó por debajo del mínimo, restaurar suavemente
            if (scale < MIN_SCALE) resetView(true);
        }
    }

    // ── Rueda del ratón (escritorio) ──────────────────────────────────────────
    viewport.addEventListener('wheel', function (e) {
        e.preventDefault();
        const rect    = viewport.getBoundingClientRect();
        const cx      = e.clientX - rect.left - rect.width  / 2;
        const cy      = e.clientY - rect.top  - rect.height / 2;
        const factor  = e.deltaY < 0 ? 1.15 : 1 / 1.15;
        zoomAt(cx, cy, scale * factor);
    }, { passive: false });

    // ── Doble clic ratón ──────────────────────────────────────────────────────
    viewport.addEventListener('dblclick', function (e) {
        if (scale > 1) {
            resetView(true);
        } else {
            const rect = viewport.getBoundingClientRect();
            zoomAt(e.clientX - rect.left - rect.width  / 2,
                   e.clientY - rect.top  - rect.height / 2,
                   3);
        }
    });

})();
</script>
</body>
</html>
